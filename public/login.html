<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agua Neon | Inicio de sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">A</div>
        <div>
          <p class="eyebrow">Ecosistema</p>
          <h1>Agua Neon</h1>
        </div>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" placeholder="admin@agua.neon" required />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>

        <div id="loginError" class="auth-error" aria-live="polite"></div>
        <button class="login-btn" type="submit">Iniciar sesión</button>
      </form>

      <div class="helper-text">
        Usuario demo: admin@agua.neon<br />
        Contraseña: AguaNeon2026!
      </div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const errorBox = document.getElementById('loginError');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.textContent = '';

        const formData = new FormData(form);
        const payload = {
          email: formData.get('email'),
          password: formData.get('password')
        };

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'No se pudo iniciar sesión.');
          }

          window.location.href = data.redirectTo || '/';
        } catch (error) {
          errorBox.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
